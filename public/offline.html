<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>오프라인 · UNDERDUCK FC</title>
    <!--
      서비스워커의 오프라인 폴백 화면.
      ⚠️ 일부러 외부 의존성(JS/CSS/폰트/이미지)을 두지 않았다.
         앱이 새 버전으로 배포돼 청크 해시가 바뀌어도 이 화면은 항상 그대로 뜬다.
      ⚠️ 경기 점수·투표 결과 같은 데이터는 절대 넣지 않는다. 오래된 값을 보여주는 것이
         "오프라인"이라고 알려주는 것보다 훨씬 나쁘다.
    -->
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
        background: #f6f6f7;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.011em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #f4f4f5;
        }
        .card {
          background: #141416 !important;
          border-color: rgba(255, 255, 255, 0.08) !important;
        }
        .sub {
          color: #a1a1aa !important;
        }
        .btn {
          background: #ffb6c1 !important;
          color: #000 !important;
        }
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 28px 24px;
        text-align: center;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 24px;
        box-shadow: 0 1px 2px rgba(17, 17, 26, 0.04),
          0 6px 20px -8px rgba(17, 17, 26, 0.14);
      }
      .badge {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #ff8fa3;
      }
      h1 {
        margin: 10px 0 0;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .sub {
        margin: 10px 0 0;
        font-size: 12.5px;
        line-height: 1.7;
        font-weight: 500;
        color: #71717a;
      }
      .btn {
        margin-top: 22px;
        width: 100%;
        padding: 13px 16px;
        border: 0;
        border-radius: 14px;
        background: #ff8fa3;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .duck {
        font-size: 40px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="duck">🦆</div>
      <p class="badge">Underduck FC</p>
      <h1>네트워크에 연결되어 있지 않아요</h1>
      <p class="sub">
        지금은 최신 기록을 불러올 수 없습니다.<br />
        연결이 돌아오면 바로 이어서 볼 수 있어요.
      </p>
      <button class="btn" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
